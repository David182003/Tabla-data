<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"> -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Datos de Prueba</title>
</head>
<body>
    <h1>Datos de Prueba</h1>
    <form id="formulario">
        <div class="Container">
            <!-- <label for="nombre">Nombre:</label> -->
            <input type="text" id="nombre" placeholder="Write your name" name="nombre" required><br><br>
        </div>
       <div class="Container">
            <!-- <label for="numero">Numero:</label> -->
            <input type="number" id="numero" placeholder="Choose a number" name="numero" required><br><br>
       </div>
       <div class="Container">
            <button id="enviar">Enviar</button>
       </div>
        
    </form>
    <table class="table">
        <thead>
            <!-- <tr>
                <th>Nombre</th>
                <th>Numero</th>
            </tr> -->
        </thead>
        <tbody id="tabla-registros">
           
        </tbody>
    </table>

    <script src="firebase.js"></script>
    <script>
        const formulario = document.getElementById('formulario');
        const db = firebase.firestore();
        const tablaRegistros = document.getElementById('tabla-registros');

        formulario.addEventListener('submit', (e) =>{
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const numero = document.getElementById('numero').value;

            db.collection('usuario').add({
                nombre: nombre,
                numero: numero
            })
            .then((docRef) => {
                console.log('Documento agregado con Id:', docRef.id);
                formulario.reset();
                mostrarRegistros();
            })
            .catch((error) => {
                console.error('Error al agregar el documento: ', error);
            });
        });

        function mostrarRegistros() {
            tablaRegistros.innerHTML = '';
            db.collection('usuario').get()
            .then((querySnapshot) => {
                querySnapshot.forEach((doc) => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td id="nombree">${doc.data().nombre}</td>
                        <td id="numeroo">${doc.data().numero}</td>
                        `;
                        tablaRegistros.appendChild(fila);
                });
            })
            .catch((error) => {
                console.error('Error al obtener los documentos: ', error );
            });
        }

        mostrarRegistros();
    </script>
</body>
</html>
